{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}
<section class="expense-section">
    <div class="expense-container">

        <div class="expense-header">
            <h1 class="expense-title">Add New Expense</h1>
            <p class="expense-subtitle">Record your transaction to keep your budget on track</p>
        </div>

        <div class="expense-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹) *</label>
                    <div class="amount-input-wrapper">
                        <span class="currency-symbol" aria-hidden="true">₹</span>
                        <input type="number" id="amount" name="amount"
                               class="form-input amount-input" placeholder="0.00"
                               step="0.01" min="0.01"
                               value="{{ amount or '' }}"
                               required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <div class="select-wrapper">
                        <select id="category" name="category" class="form-select" required>
                            <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date or today }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Grocery run, train ticket"
                           maxlength="200"
                           value="{{ description or '' }}">
                    <span class="char-counter">Max 200 characters</span>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('profile') }}" class="btn-cancel-expense">Cancel</a>
                    <button type="submit" class="btn-save-expense">Save Expense</button>
                </div>
            </form>
        </div>

    </div>
</section>
{% endblock %}
